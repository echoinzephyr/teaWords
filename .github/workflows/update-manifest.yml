name: Refresh public update manifest

on:
  release:
    types: [published, edited, unpublished, deleted, prereleased, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from public releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/updates/build_manifest.py
      - name: Commit changed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public update manifest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
